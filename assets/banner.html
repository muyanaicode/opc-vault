<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(1200px 500px at 15% -10%,#1b2a4a 0%,#0f1115 55%);color:#e7e9ee;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:70px 78px;}
  .row{display:flex;align-items:center;gap:18px}
  .logo{width:64px;height:64px;border-radius:16px;background:#6ea0ff;color:#07101f;font-weight:800;
        display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:.5px}
  .brand{font-size:22px;color:#98a1af;letter-spacing:.2px}
  h1{font-size:82px;font-weight:800;letter-spacing:-2px;margin:26px 0 10px}
  .tag{font-size:30px;font-weight:650;color:#9fb8ff}
  .desc{font-size:22px;color:#aab3c2;margin-top:22px;line-height:1.6}
  .chips{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
  .chip{font-size:18px;color:#cdd6e5;border:1px solid #2a3346;background:#161b25;border-radius:999px;padding:8px 16px}
  .foot{position:absolute;left:78px;bottom:52px;font-size:18px;color:#7d8798;letter-spacing:.3px}
  .accent{color:#6ea0ff}
</style></head>
<body>
  <div class="row"><div class="logo">OPC</div><div class="brand">沐言 AI 出品</div></div>
  <h1>OPC Vault</h1>
  <div class="tag">一人公司的「加密账套金库」</div>
  <div class="desc">营业执照 · 对公账户 · 税务 · 证照印章，按「公司主体 ⟷ 账套（多对多）」收好。<br>单字段一键复制 · 批量导入 · 执照拍照 OCR · 一键进电子税务局。</div>
  <div class="chips"><span class="chip">本地优先</span><span class="chip">AES-256-GCM 加密</span><span class="chip">零服务端</span><span class="chip">开源自托管免费</span></div>
  <div class="foot"><span class="accent">github.com/muyanaicode/opc-vault</span> · 资源导航 boyue.ai</div>
</body></html>
